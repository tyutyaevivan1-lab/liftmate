<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>LiftMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <!-- Telegram Web App SDK: даёт доступ к window.Telegram.WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="back-button" id="backButton" type="button" aria-label="Назад" hidden>
        <span aria-hidden="true">←</span>
      </button>
      <h1 class="app-header__title" id="screenTitle">LiftMate</h1>
    </header>

    <main class="screens" id="screens">
      <!-- Экран "Главная": дашборд (streak/звание, план на сегодня, неделя, последняя тренировка) -->
      <section class="screen screen--active" id="screen-home" data-screen="home">
        <div class="home-screen" id="homeScreen"></div>
      </section>

      <!-- Экран "Прогресс" (бывший корневой экран) — категории мышц -->
      <section class="screen" id="screen-categories" data-screen="categories">
        <div class="category-grid" id="categoryGrid"></div>
      </section>

      <!-- Экран 5: программа тренировки (teaser: первые 2 упражнения открыты всем,
           остальные заблокированы/размыты, если пользователь не premium) -->
      <section class="screen" id="screen-program" data-screen="program">
        <div class="program-screen" id="programScreen"></div>
      </section>

      <!-- Экран "Профиль" — пока заглушка -->
      <section class="screen" id="screen-profile" data-screen="profile">
        <div class="profile-screen" id="profileScreen"></div>
      </section>

      <!-- Экран 2: упражнения выбранной категории -->
      <section class="screen" id="screen-exercises" data-screen="exercises">
        <div class="exercise-list" id="exerciseList"></div>
        <button class="add-custom-button" id="addCustomButton" type="button">
          <span class="add-custom-button__icon" aria-hidden="true">➕</span>
          <span id="addCustomButtonLabel">Добавить своё упражнение</span>
        </button>
      </section>

      <!-- Экран 3: форма добавления своего упражнения -->
      <section class="screen" id="screen-custom-form" data-screen="custom-form">
        <form class="custom-form" id="customExerciseForm">
          <label class="custom-form__label" id="customFormLabel" for="customExerciseInput">
            Название упражнения
          </label>
          <input
            class="custom-form__input"
            id="customExerciseInput"
            type="text"
            autocomplete="off"
            maxlength="60"
          />
          <button class="custom-form__submit" id="customFormSubmit" type="submit">
            Сохранить
          </button>
        </form>
      </section>

      <!-- Экран 4: карточка упражнения — последний результат + график прогресса -->
      <section class="screen" id="screen-exercise-detail" data-screen="exercise-detail">
        <div class="exercise-detail" id="exerciseDetail"></div>
      </section>
    </main>

    <!-- Нижнее таб-меню: Главная / Программа / Прогресс / Профиль (см. app.js: switchTab) -->
    <nav class="tab-bar" id="tabBar">
      <button class="tab-bar__item" type="button" data-tab="home">
        <span class="tab-bar__icon" aria-hidden="true">🏠</span>
        <span class="tab-bar__label" data-tab-label="home">Главная</span>
      </button>
      <button class="tab-bar__item" type="button" data-tab="program">
        <span class="tab-bar__icon" aria-hidden="true">🗓</span>
        <span class="tab-bar__label" data-tab-label="program">Программа</span>
      </button>
      <button class="tab-bar__item" type="button" data-tab="progress">
        <span class="tab-bar__icon" aria-hidden="true">📈</span>
        <span class="tab-bar__label" data-tab-label="progress">Прогресс</span>
      </button>
      <button class="tab-bar__item" type="button" data-tab="profile">
        <span class="tab-bar__icon" aria-hidden="true">👤</span>
        <span class="tab-bar__label" data-tab-label="profile">Профиль</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
